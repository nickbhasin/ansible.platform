---
- name: Cleanup manager idle test socket artifacts
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Remove molecule idle test socket files if present
      ansible.builtin.shell: |
        python3 - <<'PY'
        import glob
        import os
        import tempfile
        socket_dir = os.path.join(tempfile.gettempdir(), "ansible_platform")
        for path in glob.glob(os.path.join(socket_dir, "molecule_idle_test*.sock*")):
            try:
                os.remove(path)
            except FileNotFoundError:
                pass
        PY
      register: rm_result
      changed_when: false
      failed_when: rm_result.rc != 0
