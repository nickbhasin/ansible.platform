---
- name: Ensure mock Gateway is reachable
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_connection: local
    gateway_hostname: "http://127.0.0.1:8000"
  tasks:
    - name: Wait for mock Gateway health endpoint
      ansible.builtin.uri:
        url: "{{ gateway_hostname }}/health"
        method: GET
        status_code: 200
      register: health
      retries: 12
      delay: 5
      until: health.status == 200
      vars:
        ansible_connection: local

- name: Run manager idle shutdown check
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # inventory.yml sets ansible.platform.http for all hosts; force local for command/script tasks
    ansible_connection: local
    gateway_hostname: "http://127.0.0.1:8000"
  tasks:
    # Subprocess `python3` does not use Ansible's collection loader. Flat CI checkouts
    # (repo root = collection with plugins/) have no ansible_collections/ in the tree;
    # symlink collection root into a temp ansible_collections/ansible/platform layout.
    - name: Create ansible_collections namespace for subprocess imports
      ansible.builtin.file:
        path: /tmp/molecule-manager-idle-mock-ns/ansible_collections/ansible
        state: directory
        mode: "0755"
      vars:
        ansible_connection: local

    - name: Resolve collection root (playbook_dir is .../manager_idle_mock)
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../../"
      register: coll_root_stat
      vars:
        ansible_connection: local

    - name: Symlink collection root to ansible.platform import path
      ansible.builtin.file:
        src: "{{ coll_root_stat.stat.path }}"
        dest: /tmp/molecule-manager-idle-mock-ns/ansible_collections/ansible/platform
        state: link
        force: true
      vars:
        ansible_connection: local

    - name: Execute idle shutdown verification script
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/files/idle_shutdown_check.py"
      environment:
        PYTHONPATH: /tmp/molecule-manager-idle-mock-ns
        GATEWAY_HOSTNAME: "{{ gateway_hostname }}"
        ANSIBLE_PLATFORM_MANAGER_IDLE_POLL_SECONDS: "1"
      register: idle_check
      changed_when: false
      failed_when: false
      vars:
        ansible_connection: local

    - name: Assert idle shutdown script succeeded
      ansible.builtin.assert:
        that:
          - idle_check.rc == 0
        fail_msg: "{{ idle_check.stderr | default('') }} {{ idle_check.stdout | default('') }}"
      vars:
        ansible_connection: local
...
